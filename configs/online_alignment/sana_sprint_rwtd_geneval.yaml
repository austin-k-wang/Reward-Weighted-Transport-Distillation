model:
  config_path: /opt/tiger/rwtd/Sana/configs/sana_sprint_config/1024ms/SanaSprint_1600M_1024px_allqknorm_bf16_scm_ladd.yaml
  checkpoint_path: /opt/tiger/rwtd/models/Sana_Sprint_1.6B_1024px/checkpoints/Sana_Sprint_1.6B_1024px.pth
  text_encoder_path: Efficient-Large-Model/gemma-2-2b-it
  vae_path: mit-han-lab/dc-ae-f32c32-sana-1.1-diffusers
  local_files_only: true
  resolution: 1024
  guidance_scale: 4.5
  num_inference_steps: 1
  rollout_chunk_size: 2
  decode_chunk_size: 1
  gradient_checkpointing: true
  vae_gradient_checkpointing: true
  cache_text_embeddings: true
  text_encoding_batch_size: 8
  text_embedding_cache_path: /opt/tiger/rwtd/outputs/cache/sana_sprint_gemma_embeddings.pt
  rebuild_text_embedding_cache: false

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - attn.qkv
    - attn.proj
    - cross_attn.q_linear
    - cross_attn.kv_linear
    - cross_attn.proj
  init_weights: gaussian

reward:
  enabled: true
  provider: geneval
  batch_size: 2
  socket_path: /tmp/geneval-{local_rank}.sock
  timeout: 300
  startup_timeout: 900
  reward_mode: hybrid
  binary_bonus: 0.25
  warmup: false

evaluation:
  enabled: true
  provider: geneval
  interval_steps: 10
  prompt_file: /opt/tiger/geneval-stack/geneval/prompts/evaluation_metadata.jsonl
  prompt_count: 53
  seed: 1234
  samples_per_prompt: 1
  prompt_batch_size: 4
  reward_batch_size: 4
  reward_mode: binary
  binary_bonus: 0.0

features:
  enabled: true
  model_path: /opt/tiger/rwtd/models/facebook-dinov2-base
  names:
    - cls
    - patch_mean
    - patch_std
  dtype: float32

objective:
  name: rwtd
  current_samples: 24
  reference_samples: 24
  matched_noise: false
  feature_weights:
    - 1.0
    - 1.0
    - 1.0

rwtd:
  coupling: sinkhorn
  sinkhorn_target: barycentric
  stochastic_transport: false
  reward_temperature: 0.5
  reward_mean: 0.0
  reward_scale: 1.0
  mass_floor: 0.10
  reference_fraction: 0.15
  transport_step: 0.20
  ot_regularization_scale: 0.10
  minimum_ot_epsilon: 1.0e-4
  sinkhorn_iterations: 100
  sinkhorn_tolerance: 1.0e-5
  displacement_clip: null
  feature_stats_path: null

optimizer:
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  epsilon: 1.0e-8
  max_grad_norm: 1.0
  scheduler: constant
  warmup_steps: 0

runtime:
  # Supply a training-only structured GenEval JSONL; never use the upstream
  # evaluation_metadata.jsonl here.
  prompt_file: /opt/tiger/rwtd/data/geneval/train-800.jsonl
  train_batch_size: 1
  max_train_steps: 5000
  gradient_accumulation_steps: 8
  dataloader_num_workers: 0
  mixed_precision: bf16
  seed: 42

logging:
  output_dir: /opt/tiger/rwtd/outputs/sana-sprint-alignment/rwtd-geneval
  logging_steps: 1
  checkpointing_steps: 100
  report_to: tensorboard
  resume_from_checkpoint: null
